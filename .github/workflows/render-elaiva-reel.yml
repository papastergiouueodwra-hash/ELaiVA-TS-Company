name: Render ELåiVA Reel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social/elaiva-kawaii-reel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Render MP4
        run: npx remotion render src/remotion.tsx KawaiiReel /tmp/elaiva-kawaii-reel.mp4 --codec=h264

      - name: Verify MP4
        run: test -s /tmp/elaiva-kawaii-reel.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELaiVA-Kawaii-Reel-MP4
          path: /tmp/elaiva-kawaii-reel.mp4
          retention-days: 30
