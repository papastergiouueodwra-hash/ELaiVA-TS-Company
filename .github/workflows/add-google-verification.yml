name: Fix Google Search Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore approved ELaiVA content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Restore the approved Human Customer Support copy without changing layout.
          old_support = 'Human customer support when your business needs it.'
          support_paragraphs = '''<p>
        Παράλληλα με τις AI λύσεις μας, προσφέρουμε Human Customer Support για επιχειρήσεις που θέλουν να συνδυάσουν την τεχνολογία με την ανθρώπινη επικοινωνία.
      </p>
      <p>
        Αναλαμβάνουμε την εξυπηρέτηση πελατών, τη διαχείριση εισερχόμενων αιτημάτων και την καθημερινή επικοινωνία με το κοινό σας.
      </p>
      <p>
        Με την υπηρεσία μας, οι επιχειρήσεις μπορούν να έχουν σταθερή ανθρώπινη υποστήριξη χωρίς το κόστος μιας πλήρους πρόσληψης και διατήρησης επιπλέον προσωπικού.
      </p>
      <p>
        Έτσι μειώνουν λειτουργικά και μισθολογικά έξοδα, ενώ παράλληλα διατηρούν υψηλό επίπεδο εξυπηρέτησης.
      </p>
      <p>
        Περισσότερη υποστήριξη, μικρότερο κόστος, χωρίς την ανάγκη δημιουργίας ενός επιπλέον in-house τμήματος.
      </p>'''
          if old_support in s:
              s = s.replace(old_support, support_paragraphs, 1)

          # 2) Restore the correct CTA copy.
          s = s.replace("Let's build something smarter.", "READY TO MAKE YOUR BUSINESS SMARTER? CONTACT US", 1)

          # Remove the incorrect placeholder contact email and restore the approved email.
          s = s.replace('contact@elaiva.gr', 'elaivatscompany@gmail.com')
          s = s.replace('mailto\\:contact@elaiva.gr', 'mailto:elaivatscompany@gmail.com')

          # 3) Restore all three approved phone numbers wherever the incorrect placeholder phone was used.
          phones_html = '''<a href="tel:+306984059324">+30 698 405 9324</a>
      <a href="tel:+306985692512">+30 698 569 2512</a>
      <a href="tel:+306973679762">+30 697 367 9762</a>'''
          pattern = r'<a\s+href=["\']tel:\+306900000000["\'][^>]*>\+?30?\s*690\s*000\s*0000</a>'
          s = re.sub(pattern, phones_html, s)

          # Also replace a plain placeholder phone if one remains, without touching other content.
          s = s.replace('+30 690 000 0000', '+30 698 405 9324')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Restore ELaiVA contact and support content"
          git push
